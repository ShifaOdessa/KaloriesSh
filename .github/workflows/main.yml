name: Build Android APK

# Запуск сборки при каждом пуше в основную ветку (main или master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачивание кода вашего репозитория на сервер GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Установка Java JDK 17 (необходима для сборки современных Android-приложений)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Выдача прав на запуск скрипта Gradle-wrapper
    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    # 4. Компиляция дебаг-версии APK при помощи Gradle
    - name: Build Debug APK
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: assembleDebug

    # 5. Сохранение собранного APK в виде артефакта, готового к скачиванию
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: calorie-tracker-apk
        path: app/build/outputs/apk/debug/app-debug.apk
